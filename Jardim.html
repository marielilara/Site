<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Jardim Digital</title>

<style>
/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Segoe UI",sans-serif;
    background:#050816;
    color:white;
}

/* =========================
   FUNDO
========================= */
body{
    background:
        radial-gradient(circle at top, rgba(98,114,255,0.15), transparent 40%),
        linear-gradient(to bottom,#050816,#07111f 40%, #08151c 100%);
}

/* estrelas */
.stars{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:.7;
    animation: twinkle linear infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.2; transform:scale(1);}
    50%{opacity:1; transform:scale(1.8);}
}

/* névoa */
.fog{
    position:absolute;
    bottom:0;
    width:100%;
    height:240px;
    background:linear-gradient(to top,
    rgba(168,255,218,.09),
    transparent);
    filter:blur(30px);
    animation:fogMove 12s ease-in-out infinite alternate;
    z-index:1;
}

@keyframes fogMove{
    from{transform:translateX(-20px);}
    to{transform:translateX(20px);}
}

/* partículas */
.particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.particle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0px);
        opacity:0;
    }
    20%{opacity:.8;}
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

/* =========================
   CONTAINER
========================= */
.container{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================
   TÍTULO
========================= */
.title{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
    z-index:10;
    pointer-events:none;
}

.title h1{
    font-size:3rem;
    letter-spacing:2px;
    color:#d8d6ff;
    text-shadow:
        0 0 10px rgba(180,180,255,.4),
        0 0 30px rgba(150,100,255,.2);
    font-weight:300;
}

.title p{
    margin-top:10px;
    color:#b9c4d6;
    font-size:.95rem;
    opacity:.8;
}

/* =========================
   FRASES POÉTICAS
========================= */
.poetry{
    position:absolute;
    top:20%;
    width:100%;
    text-align:center;
    font-style:italic;
    color:rgba(255,255,255,.25);
    font-size:1.2rem;
    opacity:0;
    transition:2s;
    z-index:3;
    pointer-events:none;
}

/* =========================
   JARDIM
========================= */
.garden{
    position:absolute;
    bottom:0;
    width:100%;
    height:45%;
    z-index:5;
}

/* grama */
.grass{
    position:absolute;
    bottom:0;
    width:100%;
    height:160px;
    background:
    radial-gradient(circle at 20% 20%, rgba(100,255,180,.15), transparent 20%),
    linear-gradient(to top,#0d2419,#102f23);
    border-top:1px solid rgba(255,255,255,.05);
}

/* =========================
   BOTÕES
========================= */
.ui{
    position:absolute;
    top:30px;
    right:30px;
    z-index:20;
    display:flex;
    gap:12px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:14px;
    cursor:pointer;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    color:white;
    transition:.3s;
    border:1px solid rgba(255,255,255,.08);
}

button:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.15);
    box-shadow:0 0 18px rgba(180,180,255,.2);
}

/* =========================
   MODAL
========================= */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:.4s;
}

.modal.active{
    opacity:1;
    pointer-events:auto;
}

.modal-box{
    width:90%;
    max-width:420px;
    padding:28px;
    border-radius:24px;
    background:rgba(10,16,30,.88);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    box-shadow:0 0 40px rgba(120,100,255,.18);
}

.modal h2{
    font-weight:300;
    margin-bottom:18px;
    color:#e8e6ff;
}

textarea{
    width:100%;
    height:110px;
    resize:none;
    border:none;
    outline:none;
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,.06);
    color:white;
    margin-bottom:18px;
    font-size:1rem;
}

.send-btn{
    width:100%;
}

/* =========================
   PLANTAS
========================= */
.plant{
    position:absolute;
    bottom:90px;
    cursor:pointer;
    transform-origin:bottom center;
    animation:sway 4s ease-in-out infinite;
    transition:.3s;
}

.plant:hover{
    transform:scale(1.08);
}

@keyframes sway{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:rotate(2deg);}
}

/* caule */
.stem{
    width:6px;
    height:60px;
    margin:auto;
    background:linear-gradient(to top,#335c41,#89d89e);
    border-radius:10px;
}

/* flor base */
.flower{
    width:42px;
    height:42px;
    border-radius:50%;
    margin:auto;
    position:relative;
}

/* esperança */
.hope .flower{
    background:#f5ffb8;
    box-shadow:
    0 0 18px #fff5a5,
    0 0 40px rgba(255,255,180,.7);
}

/* tristeza */
.sad .flower{
    background:#6da2ff;
    transform:translateY(10px);
    opacity:.7;
    box-shadow:0 0 15px rgba(100,150,255,.4);
}

/* amor */
.love .flower{
    background:#ff94c2;
    box-shadow:0 0 18px rgba(255,120,180,.5);
}

/* medo */
.fear .flower{
    background:#31253f;
    border-radius:50% 50% 40% 40%;
    box-shadow:0 0 16px rgba(130,100,180,.3);
}

/* raiva */
.anger .flower{
    background:#ff4a4a;
    clip-path:polygon(50% 0%, 60% 35%, 100% 50%, 60% 65%, 50% 100%, 40% 65%, 0% 50%, 40% 35%);
    box-shadow:0 0 16px rgba(255,70,70,.5);
}

/* brilho raro */
.rare{
    animation:
    sway 4s ease-in-out infinite,
    glow 2.5s ease-in-out infinite;
}

@keyframes glow{
    0%,100%{
        filter:drop-shadow(0 0 5px rgba(255,255,255,.2));
    }
    50%{
        filter:drop-shadow(0 0 20px rgba(255,255,255,.9));
    }
}

/* =========================
   TOOLTIP
========================= */
.tooltip{
    position:absolute;
    padding:12px 16px;
    background:rgba(10,15,25,.95);
    border-radius:14px;
    max-width:220px;
    color:#d9e2ff;
    font-size:.9rem;
    border:1px solid rgba(255,255,255,.08);
    pointer-events:none;
    opacity:0;
    transition:.3s;
    z-index:100;
    backdrop-filter:blur(10px);
}

/* =========================
   RESPONSIVO
========================= */
@media(max-width:700px){

    .title h1{
        font-size:2.1rem;
    }

    .ui{
        top:auto;
        bottom:20px;
        right:50%;
        transform:translateX(50%);
    }

    button{
        padding:10px 14px;
    }
}
</style>
</head>

<body>

<!-- Música -->
<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a0a4d44f.mp3?filename=fantasy-game-background-loop-110624.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <!-- Estrelas -->
    <div class="stars" id="stars"></div>

    <!-- Partículas -->
    <div class="particles" id="particles"></div>

    <!-- Névoa -->
    <div class="fog"></div>

    <!-- Título -->
    <div class="title">
        <h1>Jardim Digital</h1>
        <p>Um lugar onde emoções criam raízes.</p>
    </div>

    <!-- Frases -->
    <div class="poetry" id="poetry"></div>

    <!-- UI -->
    <div class="ui">
        <button id="plantBtn">🌱 Plantar</button>
        <button id="musicBtn">🎵 Música</button>
    </div>

    <!-- Jardim -->
    <div class="garden">
        <div class="grass"></div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h2>O que você quer deixar crescer aqui?</h2>

        <textarea id="messageInput"
        placeholder="Escreva uma emoção, um pensamento ou um pequeno segredo..."></textarea>

        <button class="send-btn" id="sendBtn">
            Plantar no jardim
        </button>
    </div>
</div>

<script>
/* =========================
   ESTRELAS
========================= */
const stars = document.getElementById("stars");

for(let i=0;i<160;i++){
    const star = document.createElement("div");
    star.classList.add("star");

    star.style.left = Math.random()*100 + "%";
    star.style.top = Math.random()*100 + "%";

    const size = Math.random()*3 + 1;
    star.style.width = size+"px";
    star.style.height = size+"px";

    star.style.animationDuration = (Math.random()*5+3)+"s";

    stars.appendChild(star);
}

/* =========================
   PARTÍCULAS
========================= */
const particles = document.getElementById("particles");

function createParticle(){
    const p = document.createElement("div");
    p.classList.add("particle");

    const size = Math.random()*4+2;

    p.style.width = size+"px";
    p.style.height = size+"px";

    p.style.left = Math.random()*100+"%";
    p.style.bottom = "-20px";

    p.style.animationDuration = (Math.random()*12+8)+"s";

    particles.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },20000);
}

setInterval(createParticle,400);

/* =========================
   MODAL
========================= */
const modal = document.getElementById("modal");
const plantBtn = document.getElementById("plantBtn");
const sendBtn = document.getElementById("sendBtn");
const input = document.getElementById("messageInput");

plantBtn.onclick = ()=>{
    modal.classList.add("active");
};

modal.onclick = (e)=>{
    if(e.target === modal){
        modal.classList.remove("active");
    }
};

/* =========================
   POESIA
========================= */
const poetry = document.getElementById("poetry");

const phrases = [
"Algumas raízes crescem no silêncio.",
"Nem toda flor nasce sob o sol.",
"O jardim se lembra.",
"Há emoções que florescem apenas à noite.",
"As estrelas escutam o que não dizemos.",
"Até a tristeza aprende a florescer.",
"Certas memórias criam pétalas."
];

function showPhrase(){

    poetry.innerText =
    phrases[Math.floor(Math.random()*phrases.length)];

    poetry.style.opacity = 1;

    setTimeout(()=>{
        poetry.style.opacity = 0;
    },5000);
}

setInterval(showPhrase,12000);

/* =========================
   PLANTAS
========================= */
const garden = document.querySelector(".garden");
const tooltip = document.getElementById("tooltip");

function detectEmotion(text){

    text = text.toLowerCase();

    if(text.includes("esperança") || text.includes("sonho"))
        return "hope";

    if(text.includes("triste") || text.includes("saudade"))
        return "sad";

    if(text.includes("amor") || text.includes("carinho"))
        return "love";

    if(text.includes("medo") || text.includes("ansiedade"))
        return "fear";

    if(text.includes("raiva") || text.includes("ódio"))
        return "anger";

    const emotions = ["hope","sad","love","fear","anger"];

    return emotions[Math.floor(Math.random()*emotions.length)];
}

function createPlant(message){

    const emotion = detectEmotion(message);

    const plant = document.createElement("div");
    plant.classList.add("plant", emotion);

    // planta rara
    if(Math.random() > 0.82){
        plant.classList.add("rare");
    }

    plant.style.left = Math.random()*90 + "%";

    plant.innerHTML = `
        <div class="flower"></div>
        <div class="stem"></div>
    `;

    // mensagem
    plant.dataset.message = message;

    // tooltip
    plant.addEventListener("click",(e)=>{

        tooltip.innerText = plant.dataset.message;

        tooltip.style.left = e.pageX + "px";
        tooltip.style.top = (e.pageY - 70) + "px";

        tooltip.style.opacity = 1;

        setTimeout(()=>{
            tooltip.style.opacity = 0;
        },4000);
    });

    garden.appendChild(plant);
}

/* =========================
   PLANTAR
========================= */
sendBtn.onclick = ()=>{

    const message = input.value.trim();

    if(message === "") return;

    createPlant(message);

    input.value = "";

    modal.classList.remove("active");
};

/* =========================
   PLANTAS INICIAIS
========================= */
const starterMessages = [
"Espero encontrar paz.",
"Tenho medo do futuro.",
"O jardim conhece minhas saudades.",
"Quero guardar esse amor.",
"Hoje estou cansado.",
"Ainda existe esperança."
];

starterMessages.forEach(msg=>{
    createPlant(msg);
});

/* =========================
   MÚSICA
========================= */
const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

let playing = false;

musicBtn.onclick = ()=>{

    if(!playing){
        music.play();
        playing = true;
        musicBtn.innerText = "🔇 Silenciar";
    }else{
        music.pause();
        playing = false;
        musicBtn.innerText = "🎵 Música";
    }
};

/* =========================
   PARALLAX LEVE
========================= */
document.addEventListener("mousemove",(e)=>{

    const x = (e.clientX/window.innerWidth - .5)*10;
    const y = (e.clientY/window.innerHeight - .5)*10;

    stars.style.transform =
    `translate(${x*0.3}px, ${y*0.3}px)`;

    particles.style.transform =
    `translate(${x*0.6}px, ${y*0.6}px)`;
});
</script>

</body>
</html>
